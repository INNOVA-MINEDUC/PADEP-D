# Bloque para el nginx del servidor, que corre en un contenedor y sirve tambien
# otros sitios.
#
#   cp deploy/nginx-padep.conf /ruta/del/volumen/conf.d/padep.conf
#   docker exec NOMBRE_NGINX nginx -t
#   docker exec NOMBRE_NGINX nginx -s reload
#
# Reenvia a un solo destino: el contenedor frontend ya sirve el build de Vue y
# reparte /api al backend por la red interna del proyecto. Aqui no hay que
# separar estatico de API.
#
# El frontend se alcanza por el alias de red `padep-frontend` (lo define
# docker-compose.yml), no por el nombre del contenedor: el nombre cambia si el
# proyecto se renombra o si algun dia hay mas de una replica.

server {
    listen 80;
    listen [::]:80;
    server_name padep.mineduc.edu.gt;   # <<< ajusta el dominio

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name padep.mineduc.edu.gt;   # <<< ajusta el dominio

    # Rutas DENTRO del contenedor de nginx. Comprueba como tienes montados los
    # certificados de los otros sitios y usa el mismo esquema.
    ssl_certificate     /etc/letsencrypt/live/padep.mineduc.edu.gt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/padep.mineduc.edu.gt/privkey.pem;

    # Los PDF se suben en trozos de 8 MB. El limite por defecto de nginx es 1 MB
    # y los corta con un 413 que parece un fallo de la aplicacion.
    client_max_body_size 32m;

    access_log /var/log/nginx/padep.access.log;
    error_log  /var/log/nginx/padep.error.log;

    location / {
        # El upstream se resuelve por variable a proposito, y aqui importa mas
        # que en el otro nginx: este contenedor sirve MAS SITIOS. Con un
        # `proxy_pass http://padep-frontend` literal, si el contenedor de PADEP
        # esta parado al recargar, nginx no levanta y se caen todos los demas.
        # Con resolver + variable, PADEP responde 502 y el resto sigue vivo.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $padep_front padep-frontend;
        proxy_pass http://$padep_front:80$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Igual que en el nginx del contenedor de PADEP: el cuerpo se encana sin
        # bufferizar y las extracciones pasan del minuto por defecto.
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
