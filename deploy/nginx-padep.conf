# Bloque para el nginx GLOBAL del servidor (el que ya sirve otros sitios).
#
#   sudo cp deploy/nginx-padep.conf /etc/nginx/sites-available/padep
#   sudo ln -s /etc/nginx/sites-available/padep /etc/nginx/sites-enabled/padep
#   sudo nginx -t && sudo systemctl reload nginx
#
# Solo reenvia a un puerto: el contenedor frontend (127.0.0.1:8080) ya sirve el
# build de Vue y reparte /api al backend por la red interna de Docker. Aqui no
# hay que separar estatico de API.

server {
    listen 80;
    listen [::]:80;
    server_name padep.mineduc.edu.gt;   # <<< ajusta el dominio

    # Deja pasar el desafio de certbot y manda el resto a HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name padep.mineduc.edu.gt;   # <<< ajusta el dominio

    ssl_certificate     /etc/letsencrypt/live/padep.mineduc.edu.gt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/padep.mineduc.edu.gt/privkey.pem;

    # Los PDF suben en trozos de 8 MB. Sin esto nginx corta con 413 y la subida
    # falla a mitad, que es el fallo mas facil de achacar por error a la app.
    client_max_body_size 32m;

    access_log /var/log/nginx/padep.access.log;
    error_log  /var/log/nginx/padep.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Igual que en el nginx del contenedor: el cuerpo se encana sin
        # bufferizar, y las extracciones pasan del minuto por defecto.
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
