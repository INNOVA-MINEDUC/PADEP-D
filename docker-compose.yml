# Despliegue del frontend de PADEP.
#
# Ya no hay backend aqui. El backend Express (login + proxy) se retiro en
# octubre de 2026: la API de PADEP (FastAPI, repo PycharmProjects/PADEP, su
# propio docker-compose.yml) pone ahora el login y todo lo demas.
#
# La API vive en OTRO servidor (api-padepd.mineduc.edu.gt) y el navegador le
# habla directo: su URL va incrustada en la imagen (build-arg VITE_API_URL que
# pone el pipeline). Aqui solo se sirve el estatico.
#
# El nginx del servidor corre en el HOST (no en un contenedor) y llega a cada
# app por 127.0.0.1:PUERTO, por eso el frontend se publica en 127.0.0.1.
#
#   docker compose pull && docker compose up -d      (desde el registry)
#   docker compose up -d --build                     (compilando en el server)
#
# El pipeline (.github/workflows/frontend-ci.yml) hace el pull/up solo, por SSH,
# en /opt/public_html/PADEPD-Frontend. Se configura con el .env junto a este
# archivo:
#   TAG=production-latest    rama main (valor por defecto)
#   TAG=development-latest   rama development
#   PADEP_FRONT_PUERTO=8096  puerto del host; antes de elegirlo:
#                            ss -ltnp | grep -E ':8096\b'   (vacio = libre)

# padep-app, no padep: ya existe un proyecto compose llamado 'padep' (el de
# bd/docker-compose.yml con MySQL, adminer y metabase). Compartir nombre hace
# que un `docker compose down` desde aqui se lleve por delante esos servicios.
name: padep-app

services:
  frontend:
    image: ghcr.io/innova-mineduc/padep-d-frontend:${TAG:-production-latest}
    build:
      context: ./frontend
      args:
        # Solo cuenta con `up --build` en el servidor (VITE_API_URL en el .env).
        # El pull/up normal usa la imagen del pipeline, que ya trae la suya.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    # Solo en 127.0.0.1: el nginx del host llega igual y el puerto no queda
    # abierto a Internet. Con "8096:8080" a secas, Docker lo publicaria en
    # 0.0.0.0 y ademas se salta el firewall (ufw) del servidor.
    ports:
      - "127.0.0.1:${PADEP_FRONT_PUERTO:-8096}:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
