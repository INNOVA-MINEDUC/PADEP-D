# Despliegue del frontend de PADEP en el servidor de produccion.
#
# Ya no hay backend aqui. El backend Express (login + proxy) se retiro en
# octubre de 2026: la API de PADEP (FastAPI, repo PycharmProjects/PADEP, su
# propio docker-compose.yml) pone ahora el login y todo lo demas. Este nginx le
# habla por la red `proxy` con el alias `padep-api`, asi que ESE compose tiene
# que estar arriba y en la misma red.
#
#   docker compose pull && docker compose up -d      (desde el registry)
#   docker compose up -d --build                     (compilando en el server)

# padep-app, no padep: ya existe un proyecto compose llamado 'padep' (el de
# bd/docker-compose.yml con MySQL, adminer y metabase). Compartir nombre hace
# que un `docker compose down` desde aqui se lleve por delante esos servicios.
name: padep-app

services:
  frontend:
    image: ghcr.io/innova-mineduc/padep-d-frontend:${TAG:-latest}
    build:
      context: ./frontend
      args:
        # Vacio: mismo origen, el nginx de la imagen reparte /api a la API.
        VITE_API_URL: ""
    restart: unless-stopped
    # Sin puertos publicados: el nginx del servidor tambien es un contenedor y
    # llega por red de Docker. Publicar el 8080 solo abriria una via extra.
    # Para depurar desde el propio host, descomenta:
    #   ports: ["127.0.0.1:8080:80"]
    networks:
      default: {}
      # Red compartida con el nginx del servidor y con la API (padep-api).
      proxy:
        aliases:
          # El nginx apunta a este alias, no al nombre del contenedor: el
          # nombre cambia si se renombra el proyecto o si hay mas de una
          # replica, y el alias no.
          - padep-frontend
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  # La red que ya usa el nginx del servidor para alcanzar a los demas sitios.
  # Se declara external: la crea y la gobierna ese otro stack, no este.
  #   docker inspect NOMBRE_NGINX --format '{{json .NetworkSettings.Networks}}'
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
