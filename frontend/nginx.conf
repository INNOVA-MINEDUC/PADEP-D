# Nginx de la imagen del frontend.
#
# Sirve el build de Vite y ademas hace de repartidor: /api va al contenedor
# backend por la red interna de Docker. Asi el nginx global del servidor solo
# tiene que reenviar UN puerto (ver deploy/nginx-padep.conf) y el navegador ve
# un unico origen, que es lo que espera src/api/cliente.js (BASE vacio).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los PDF se suben en trozos de 8 MB (ver backend/src/routes/extraccion.routes.js).
    # El default de nginx es 1 MB y cortaria la subida con un 413.
    client_max_body_size 32m;

    # Redirects relativos. Con el default (absolute_redirect on) nginx
    # reconstruye la URL con su propio host y puerto, asi que detras del
    # nginx del servidor un 301 salia como http://127.0.0.1/... y rompia
    # tanto el puerto como el https.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # Cabeceras minimas. El resto (HSTS, CSP) va en el nginx del host, que es
    # quien termina el TLS.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Sonda del HEALTHCHECK del contenedor. No toca disco ni ensucia el log.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Todo /api va al backend Express, que ademas hace de puerta unica hacia la
    # API de extraccion (FastAPI).
    #
    # El upstream se resuelve por variable a proposito: con un `proxy_pass
    # http://backend:4000` literal, nginx resuelve el nombre AL ARRANCAR y
    # muere si el backend todavia no esta arriba; ademas se queda con esa IP
    # aunque el contenedor se recree con otra. Con resolver + variable, cada
    # peticion vuelve a preguntarle al DNS interno de Docker (127.0.0.11).
    location ~ ^/api(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $padep_backend backend;
        proxy_pass http://$padep_backend:4000$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sin buffering de subida: el proxy de extraccion encana el cuerpo tal
        # cual sin leerlo, y guardar 8 MB en disco antes de reenviarlos anula
        # justo ese diseno.
        proxy_request_buffering off;

        # Las extracciones tardan mas que el minuto por defecto.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Health del backend, util para comprobar la cadena entera desde fuera.
    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $padep_backend_h backend;
        proxy_pass http://$padep_backend_h:4000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Los assets de Vite llevan hash en el nombre, asi que cachear a saco es
    # seguro: si el contenido cambia, cambia el nombre.
    location /assets/ {
        # Una sola cabecera: `expires` emite su propio Cache-Control y junto al
        # add_header salian dos, que es justo el tipo de cosa que luego se
        # depura a ciegas desde el navegador.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html jamas se cachea, o un deploy nuevo seguiria sirviendo los
    # <script> viejos que ya no existen.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: cualquier ruta que no sea un archivo devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
