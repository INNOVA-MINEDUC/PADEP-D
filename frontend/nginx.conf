# Nginx de la imagen del frontend.
#
# Sirve el build de Vite y ademas hace de repartidor: /api va a la API de
# PADEP (FastAPI, alias padep-api en la red proxy). Asi el nginx global del
# servidor solo tiene que reenviar UN puerto y el
# navegador ve un unico origen, que es lo que espera src/api/cliente.js.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los PDF se suben en trozos de 8 MB (PADEP_TROZO_MB en la API).
    # El default de nginx es 1 MB y cortaria la subida con un 413.
    client_max_body_size 32m;

    # Redirects relativos. Con el default (absolute_redirect on) nginx
    # reconstruye la URL con su propio host y puerto, asi que detras del
    # nginx del servidor un 301 salia como http://127.0.0.1/... y rompia
    # tanto el puerto como el https.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # Cabeceras minimas. El resto (HSTS, CSP) va en el nginx del host, que es
    # quien termina el TLS.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Sonda del HEALTHCHECK del contenedor. No toca disco ni ensucia el log.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Todo /api va a la API de PADEP (FastAPI, otro compose: PycharmProjects/
    # PADEP), por la red `proxy` y con su alias `padep-api`. Ya no hay Express
    # en medio: el login lo pone la API.
    #
    # Se le QUITA el prefijo: la API sirve /cortes y el navegador pide
    # /api/cortes. Se recorta de $request_uri —crudo, tal como lo mando el
    # navegador— y no con `rewrite`, que trabaja sobre la URI ya decodificada:
    # los nombres de PDF llevan espacios y tildes y van dentro de la ruta
    # (/cortes/{id}/pagina/{nombre}/{n}).
    #
    # El upstream se resuelve por variable a proposito: con un nombre literal,
    # nginx lo resuelve AL ARRANCAR y muere si la API todavia no esta arriba;
    # ademas se queda con esa IP aunque el contenedor se recree con otra. Con
    # resolver + variable, cada peticion vuelve a preguntarle al DNS de Docker.
    location ~ ^/api(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $padep_api padep-api;
        set $resto /;
        if ($request_uri ~ "^/api(?<sin_prefijo>/.*)$") {
            set $resto $sin_prefijo;
        }
        proxy_pass http://$padep_api:8000$resto;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sin buffering de subida: los trozos de 8 MB pasan tal cual, sin
        # escribirse antes a disco.
        proxy_request_buffering off;

        # Las extracciones tardan mas que el minuto por defecto.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Salud de la API, util para comprobar la cadena entera desde fuera.
    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $padep_api_h padep-api;
        proxy_pass http://$padep_api_h:8000/salud;
        proxy_set_header Host $host;
        access_log off;
    }

    # Los assets de Vite llevan hash en el nombre, asi que cachear a saco es
    # seguro: si el contenido cambia, cambia el nombre.
    location /assets/ {
        # Una sola cabecera: `expires` emite su propio Cache-Control y junto al
        # add_header salian dos, que es justo el tipo de cosa que luego se
        # depura a ciegas desde el navegador.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html jamas se cachea, o un deploy nuevo seguiria sirviendo los
    # <script> viejos que ya no existen.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: cualquier ruta que no sea un archivo devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
